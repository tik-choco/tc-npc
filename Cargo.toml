[workspace]
resolver = "2"
members = [
    "crates/npc-core",
    "crates/npc-llm",
    "crates/npc-talk",
    "crates/npc-memory",
    "crates/npc-speech",
    "crates/npc-vision",
    "crates/npc-action",
    "crates/npc-scheduler",
    "crates/npc-translate",
    "crates/npc-server",
    "crates/npc-tui",
]
# crates/npc-mist (the optional `mist` feature's crate) is deliberately NOT
# a member of this workspace, and is excluded here so Cargo's workspace
# directory-tree auto-discovery doesn't trip over it declaring its own
# `[workspace]` table (see its Cargo.toml) nested under this one. Excluding
# it keeps `cargo check/build --workspace` at the root from ever resolving
# or fetching its heavy mistlib git dependency. It's still reachable as an
# ordinary optional path dependency of the root package below, activated
# only by `--features mist`.
exclude = ["crates/npc-mist"]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/tik-choco/tc-npc"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `rustls-tls-native-roots` is deliberately enabled alongside the webpki
# bundle: reqwest loads both stores additively, and self-hosted / on-prem
# OpenAI-compatible endpoints are frequently fronted by a private CA that
# only exists in the OS trust store. Without it rustls rejects those with a
# bare `UnknownIssuer` even though every other tool on the machine works.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json", "multipart", "stream"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = "0.7"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
# Terminal UI (`tc-npc tui`), used only by npc-tui. Unlike Tauri these are
# small pure-Rust crates, so they are plain dependencies rather than another
# feature gate — and a headless box reached over SSH is exactly where the TUI
# earns its keep, so gating it out of headless builds would be backwards.
#
# `unstable-rendered-line-info` unlocks `Paragraph::line_count`, which
# npc-tui's `render_scrollable` needs to bottom-anchor the chat/log panels:
# "how many lines does this wrap to at this width" can't otherwise be had
# without re-implementing ratatui's own unicode-width-aware wrapping. Upstream
# marks it unstable because the signature may still change, not because it's
# unreliable — it's what ratatui's docs point scrollbar implementations at.
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
# "event-stream" turns terminal input into a `futures::Stream`, so the main
# loop can `tokio::select!` between keystrokes and incoming WebSocket frames
# rather than needing a second thread just to poll stdin.
crossterm = { version = "0.28", features = ["event-stream"] }
# Display width, not byte or char count: the TUI's labels are Japanese, where
# one char occupies two columns, so `len()` and `chars().count()` both lie and
# every truncate/pad/wrap silently drifts. Pinned to 0.2 deliberately —
# ratatui itself depends directly on 0.2, and measuring widths with a
# different version than the renderer uses is how off-by-one border corruption
# gets in. (0.1.14 is also in the graph via unicode-truncate; that one is
# ratatui's business, not ours.)
unicode-width = "0.2"
# default-features = false drops the TLS backends: tc-npc's server binds a
# bare TcpListener and never terminates TLS, so this client only ever dials
# `ws://` — directly or through an SSH port-forward. Carrying native-tls for
# a `wss://` path that is never taken would, on Windows, drag in an OpenSSL
# build requirement for nothing.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }

npc-core = { path = "crates/npc-core" }
npc-llm = { path = "crates/npc-llm" }
npc-talk = { path = "crates/npc-talk" }
npc-memory = { path = "crates/npc-memory" }
npc-speech = { path = "crates/npc-speech" }
npc-vision = { path = "crates/npc-vision" }
npc-action = { path = "crates/npc-action" }
npc-scheduler = { path = "crates/npc-scheduler" }
npc-translate = { path = "crates/npc-translate" }
npc-server = { path = "crates/npc-server" }
npc-tui = { path = "crates/npc-tui" }

[package]
name = "tc-npc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Unified Rust CLI/server for the tc-npc AI mascot agent suite"

[[bin]]
name = "tc-npc"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util.workspace = true
dirs.workspace = true

npc-core.workspace = true
npc-talk.workspace = true
npc-memory.workspace = true
npc-speech.workspace = true
npc-vision.workspace = true
npc-action.workspace = true
npc-scheduler.workspace = true
npc-translate.workspace = true
npc-server.workspace = true
npc-tui.workspace = true
npc-mist = { path = "crates/npc-mist", optional = true }
# Both optional, same reasoning as `npc-mist` above (see the `exclude`
# comment at the top of this file): Tauri's dependency tree is heavy and
# must never appear for a headless build (`cargo check/build --workspace`
# with no extra flags, and the roadmap's stage 6/7 robot/AR targets, which
# have no display to put a window on). Gated behind the `desktop` feature
# below; see `build.rs` and `src/desktop/` for the rest of the gate.
tauri = { version = "2.5", features = ["tray-icon"], optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

[build-dependencies]
# Optional/gated for the same reason as the `tauri` dependency above: only
# needed to compile the ACL/icon resources for a `--features desktop` build.
tauri-build = { version = "2.2", optional = true }

[features]
mist = ["dep:npc-mist"]
desktop = ["dep:tauri", "dep:tauri-plugin-window-state", "dep:tauri-build"]

[profile.dev]
# Windows `.pdb` files were 4.83 GB of this crate's 37.82 GB debug target dir
# (12.53 GB across tc-npc and mistl together) — full debuginfo is the single
# most expensive thing in a debug build here, and almost none of it is used:
# debugging in this project is `tracing` and `println`, not a stepping
# debugger. `line-tables-only` keeps what that style actually needs — file and
# line numbers in panics and backtraces stay intact — and drops the variable
# and type information a symbolic debugger would want.
#
# Set it back to `true` for a session where you genuinely need to inspect
# variables in WinDbg/VS; it costs a rebuild, not a redesign.
debug = "line-tables-only"
