# `mascot` is a SPIKE: it answers one question (does a transparent Tauri
# window composite a WebGL/three.js canvas correctly on WebView2, or does it
# come out opaque black) and nothing else lives here. See README.md for the
# full writeup.
#
# This file declares its own `[workspace]` rather than being a plain
# `[package]`, so it is a workspace ROOT in its own right and Cargo's
# directory-tree auto-discovery never sweeps it into the parent tc-npc
# workspace (the root Cargo.toml is not allowed to be edited this round to
# add an `exclude` entry for us the way it does for `crates/npc-mist` --
# see that file's comment on `exclude = ["crates/npc-mist"]` for the same
# reasoning applied there). A package that itself declares `[workspace]` is
# never treated as a member of an ancestor workspace, so this is sufficient
# in isolation: `cargo build`/`cargo check --workspace` run from the repo
# root never resolves or fetches Tauri's (large) dependency tree.
[workspace]
resolver = "2"

[package]
name = "tc-npc-mascot"
version = "0.1.0"
edition = "2021"
description = "SPIKE: transparent always-on-top desktop window hosting tc-npc's /#/avatar page"
publish = false

[build-dependencies]
# tauri-build embeds the Windows .ico resource and wires up the compiled
# permissions ACL / capability JSON from tauri.conf.json + capabilities/.
# Every Tauri app needs this; see tc-assistant2/src-tauri/Cargo.toml for the
# identical proven-working pin.
tauri-build = { version = "2.2", features = [] }

[dependencies]
# Same crate/version tc-assistant2 already builds successfully with on this
# machine (see src-tauri/Cargo.toml there) -- reusing known-good pins rather
# than picking fresh ones is deliberate: this spike's only job is to answer
# the transparency question, not to also debug a new dependency resolution.
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.5", features = ["tray-icon"] }
