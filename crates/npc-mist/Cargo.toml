# This crate is deliberately its own workspace root (empty `[workspace]`
# table below), NOT a member of the parent tc-npc workspace -- see the note
# next to `crates/npc-mist` in the root Cargo.toml for why: it keeps
# `cargo check/build --workspace` at the root from ever resolving/fetching
# this crate's heavy mistlib git dependency. It's still consumed normally as
# an optional path dependency of the root `tc-npc` package, activated only
# by `cargo build/check --features mist`.
#
# Being its own workspace root means it can't inherit `[workspace.package]`/
# `[workspace.dependencies]` from the parent -- every dependency version
# below is spelled out explicitly instead of `{ workspace = true }`, kept in
# sync by hand with the matching entries in the root `Cargo.toml`.
[workspace]

[package]
name = "npc-mist"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Optional mistlib P2P integration for tc-npc: presence/messaging room + tc-town character catalog discovery (mist feature)"

[dependencies]
npc-core = { path = "../npc-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# mistlib (MPL-2.0), pinned to a specific tag of the public
# tik-choco-lab/mistlib repo (https://github.com/tik-choco-lab/mistlib).
# mistlib-native's `[lib] name` is `mistlib` (see its Cargo.toml), so source
# in this crate imports it as `mistlib::...`, not `mistlib_native::...` --
# same convention the `mistl` daemon app uses for its own embedding.
#
# NOTE: v0.6.0 introduced a `#p` destination tag in Nostr signaling
# (upstream commit 187c73f, 2026-07-23) that is NOT wire-compatible with
# older mistlib builds -- native/wasm peers must upgrade in lockstep. All
# tik-choco web apps have moved to v0.6.0, so this pin must not regress
# below it.
mistlib-core = { git = "https://github.com/tik-choco-lab/mistlib", tag = "v0.6.0" }
mistlib-native = { git = "https://github.com/tik-choco-lab/mistlib", tag = "v0.6.0" }
