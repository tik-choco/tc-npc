[package]
name = "npc-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "HTTP/WebSocket server and embedded web UI host for tc-npc"

[dependencies]
npc-core = { workspace = true }
npc-llm = { workspace = true }
npc-scheduler = { workspace = true }
# For host audio device enumeration only (GET /api/audio/devices) — the
# module itself is wired by the binary, not by this crate.
npc-speech = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

axum = { version = "0.7", features = ["ws"] }
rust-embed = "8"
mime_guess = "2"
open = "5"
