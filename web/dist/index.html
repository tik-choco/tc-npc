<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TC NPC — control panel for the AI NPC agent (chat / voice / vision / action)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)" />
    <title>TC NPC</title>
    <!-- Apply the saved theme and language before first paint to avoid a
         flash of the wrong theme (FOUC) and a wrong <html lang> for CJK font
         selection. Mirrors useTheme() (default light) and lib/i18n.ts's
         detectLang() (saved choice, else the browser's first supported
         language, else ja). -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("tc-npc:theme");
          root.dataset.theme = t === "dark" ? "dark" : "light";
        } catch (e) {}
        var supported = ["ja", "en", "zh"];
        var lang = null;
        try {
          var saved = localStorage.getItem("tc-npc:lang");
          if (supported.indexOf(saved) !== -1) lang = saved;
        } catch (e) {}
        if (!lang) {
          var tags = navigator.languages || [navigator.language || ""];
          for (var i = 0; i < tags.length && !lang; i++) {
            var primary = String(tags[i] || "").toLowerCase().split("-")[0];
            if (supported.indexOf(primary) !== -1) lang = primary;
          }
        }
        root.lang = lang || "ja";
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CXgUbAwM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DxFd4hHP.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
