<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TC NPC — AI NPCエージェント(チャット/音声/視覚/行動)の操作パネル" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0e12" media="(prefers-color-scheme: dark)" />
    <title>TC NPC</title>
    <!-- Apply the saved theme before first paint to avoid a flash of the
         wrong theme (FOUC). Mirrors useTheme(): default is light. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tc-npc:theme");
          document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
